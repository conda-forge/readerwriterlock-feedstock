{% set name = "readerwriterlock" %}
{% set version = "1.0.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/readerwriterlock-{{ version }}.tar.gz
  sha256: d0e803d17569f70700137cd91c4219d2bae718794a1b0da9fd44eb189e58786d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - typing-extensions

test:
  source_files:
    - tests
  imports:
    - readerwriterlock
  commands:
    - pip check
    - set PYTHONUTF8=1  # [win]
    - pytest -vvv --capture=tee-sys tests
  requires:
    - pip
    - pytest
    - python {{ python_min }}

about:
  home: https://github.com/elarivie/pyReaderWriterLock
  summary: A python implementation of the three Reader-Writer problems.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - thewchan
