schema_version: 1

context:
  name: readerwriterlock
  version: "1.0.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/readerwriterlock-${{ version }}.tar.gz
  sha256: d0e803d17569f70700137cd91c4219d2bae718794a1b0da9fd44eb189e58786d

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - typing-extensions

tests:
  - python:
      imports:
        - readerwriterlock
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests
    requirements:
      run:
        - pip
        - pytest
        - python ${{ python_min }}.*
    script:
      - if: win
        then: set PYTHONUTF8=1
      - pytest -vvv --capture=tee-sys tests

about:
  summary: A python implementation of the three Reader-Writer problems.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/elarivie/pyReaderWriterLock

extra:
  recipe-maintainers:
    - thewchan
